# Deployed by Cloudflare Workers Builds on every merge to main that touches worker/ (connected 2026-11-21; GitHub app access granted).
name = "rtt-hreflang"
main = "src/index.js"
compatibility_date = "2026-11-18"
workers_dev = false

# Routes: the international sections and every Christmas Eve services collection (kept in sync with tools/worker-routes.txt).
routes = [
  { pattern = "www.rallytakesthetrain.com/christmas-*", zone_name = "rallytakesthetrain.com" },
  { pattern = "www.rallytakesthetrain.com/messes-de-noel*", zone_name = "rallytakesthetrain.com" },
  { pattern = "www.rallytakesthetrain.com/santa-trains*", zone_name = "rallytakesthetrain.com" },
  { pattern = "www.rallytakesthetrain.com/weihnachtszuege*", zone_name = "rallytakesthetrain.com" },
  { pattern = "www.rallytakesthetrain.com/trains-de-noel*", zone_name = "rallytakesthetrain.com" },
  { pattern = "www.rallytakesthetrain.com/treni-di-natale*", zone_name = "rallytakesthetrain.com" },
  { pattern = "www.rallytakesthetrain.com/gottesdienste-heiligabend-deutschland*", zone_name = "rallytakesthetrain.com" },
  { pattern = "www.rallytakesthetrain.com/misa-de-nochebuena-mexico*", zone_name = "rallytakesthetrain.com" },
  { pattern = "www.rallytakesthetrain.com/pasterka-wigilia-polska*", zone_name = "rallytakesthetrain.com" },
  { pattern = "www.rallytakesthetrain.com/slujbe-de-craciun-romania*", zone_name = "rallytakesthetrain.com" },
  { pattern = "www.rallytakesthetrain.com/misa-del-gallo-espana*", zone_name = "rallytakesthetrain.com" },
  { pattern = "www.rallytakesthetrain.com/missa-do-galo-brasil*", zone_name = "rallytakesthetrain.com" },
  { pattern = "www.rallytakesthetrain.com/messe-vigilia-di-natale-italia*", zone_name = "rallytakesthetrain.com" },
  { pattern = "www.rallytakesthetrain.com/hreflang-sitemap.xml", zone_name = "rallytakesthetrain.com" },
  { pattern = "www.rallytakesthetrain.com/llms.txt", zone_name = "rallytakesthetrain.com" },
  { pattern = "www.rallytakesthetrain.com/llms-full.txt", zone_name = "rallytakesthetrain.com" },
  { pattern = "www.rallytakesthetrain.com/sitemap.xml", zone_name = "rallytakesthetrain.com" },
  # Squarespace's split files (sitemap0.xml, sitemap1.xml, ...) and sitemap-new-pages.xml; other /sitemap* paths pass straight through.
  { pattern = "www.rallytakesthetrain.com/sitemap*", zone_name = "rallytakesthetrain.com" },
]

# The events directory: the site's headline event count comes from it (read only, see getDbCounts in src/index.js).
[[d1_databases]]
binding = "EVENTS_DB"
database_name = "rally-events"
database_id = "b02b08f8-ba97-419f-ab1c-a9c658365e96"

# Match the live Worker (set in the dashboard): logs and Workers issues on.
[observability]
enabled = true

[observability.logs]
enabled = true

# The deployed version's id stamps the healed-page cache, so a new deploy never serves pages healed by older code.
[version_metadata]
binding = "CF_VERSION_METADATA"

# Tests run before every deploy (Workers Builds and wrangler deploy): a failing test stops the deploy.
[build]
command = "node test/services.test.mjs"
