name: hreflang

on:
  push:
    paths:
      - 'tools/**'
      - 'hreflang-sitemap.xml'
  schedule:
    - cron: '23 */3 * * *' # every 3 hours
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: hreflang-${{ github.event_name == 'push' && 'validate' || 'auto-pair' }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check clusters.json and that the sitemap was rebuilt
        run: |
          python3 tools/build_hreflang.py
          git diff --exit-code hreflang-sitemap.xml || (echo "::error::hreflang-sitemap.xml is out of date. Run python3 tools/build_hreflang.py and commit it." && exit 1)

  auto-pair:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    env:
      # Lets our own requests past Cloudflare bot protection (custom rule "Allow Rally pipeline").
      RTT_BOT_KEY: ${{ secrets.RTT_BOT_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore the list of pages already checked
        uses: actions/cache/restore@v4
        with:
          path: .state
          key: auto-pair-state-${{ github.run_id }}
          restore-keys: auto-pair-state-

      - name: Pair new translated pages
        run: |
          mkdir -p .state
          python3 tools/auto_pair.py --state .state/auto-pair.json --report report.md
          set +e
          python3 tools/find_unpaired.py > patterns.md
          echo "PATTERNS=$?" >> "$GITHUB_ENV"

      - name: Commit any new pairs
        run: |
          if git diff --quiet -- tools/clusters.json hreflang-sitemap.xml; then
            echo "No changes to commit."
            exit 0
          fi
          python3 tools/build_hreflang.py --check
          n=$(grep -c '^- ' <(sed -n '/^## Added/,/^## /p' report.md) || true)
          git config user.name "rtt-hreflang bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/clusters.json hreflang-sitemap.xml
          { echo "Auto-pair: $n new hreflang page(s)"; echo; sed -n '/^## Added/,/^## Needs/p' report.md | grep '^- ' | head -100; } > msg.txt
          git commit -q -F msg.txt
          for i in 1 2 3; do git pull -q --rebase && git push && break; sleep 10; done

      - name: Open, update or close the review issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="hreflang: pages to review"
          needs=$(grep -c '^## Needs a look' report.md || true)
          { echo "Last checked: $(date -u '+%Y-%m-%d %H:%M UTC')"; echo; cat report.md; if [ "$PATTERNS" = "1" ]; then echo; cat patterns.md; fi; } > issue.md
          num=$(gh issue list --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ "$needs" != "0" ] || [ "$PATTERNS" = "1" ]; then
            if [ -n "$num" ]; then gh issue edit "$num" --body-file issue.md
            else gh issue create --title "$title" --body-file issue.md; fi
          elif [ -n "$num" ]; then
            gh issue close "$num" --comment "Everything is paired now."
          fi

      - name: Rebuild the live counts (events, free events, cities) from the site
        run: |
          git pull -q --rebase || true
          python3 tools/truth/build_truth.py --state .state/truth.json
          if git diff --quiet -- tools/truth/live.json && [ -z "$(git status --porcelain tools/sqsp/ids.json)" ]; then
            echo "Counts unchanged."
            exit 0
          fi
          git config user.name "rtt-hreflang bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/truth/live.json tools/sqsp/ids.json
          git commit -q -m "Live counts: $(python3 -c "import json;t=json.load(open('tools/truth/live.json'))['total'];print(f\"{t['events']:,} events, {t['free']:,} free, {t['cities']:,} cities\")")"
          for i in 1 2 3; do git pull -q --rebase && git push && break; sleep 10; done

      - name: Rebuild llms.txt from the live site
        run: |
          git pull -q --rebase || true
          python3 tools/llms/build_llms.py --cache .state/llms-titles.json
          if git diff --quiet -- llms.txt llms-full.txt; then
            echo "llms.txt unchanged."
            exit 0
          fi
          git config user.name "rtt-hreflang bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add llms.txt llms-full.txt
          git commit -q -m "llms.txt: rebuilt from the live site"
          for i in 1 2 3; do git pull -q --rebase && git push && break; sleep 10; done

      - name: Audit the counts against the sitemap (event pages no city page lists)
        run: |
          git pull -q --rebase || true
          python3 tools/truth/audit_sitemap.py || exit 0
          if [ -z "$(git status --porcelain tools/truth/audit.json)" ]; then exit 0; fi
          git config user.name "rtt-hreflang bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/truth/audit.json
          git commit -q -m "Counts audit against the sitemap"
          for i in 1 2 3; do git pull -q --rebase && git push && break; sleep 10; done

      - name: Keep sitemap.xml complete (add missing pages, drop 404s and redirects)
        run: |
          git pull -q --rebase || true
          python3 tools/sitemap/build_fix.py --state .state/sitemap.json
          if [ -z "$(git status --porcelain tools/sitemap/fix.json)" ]; then
            echo "Sitemap fix unchanged."
            exit 0
          fi
          git config user.name "rtt-hreflang bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/sitemap/fix.json
          git commit -q -m "sitemap.xml: $(python3 -c "import json;f=json.load(open('tools/sitemap/fix.json'));print(f\"{len(f['add'])} pages added, {len(f['remove'])} dead URLs dropped\")")"
          for i in 1 2 3; do git pull -q --rebase && git push && break; sleep 10; done

      - name: Save the list of pages already checked
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .state
          key: auto-pair-state-${{ github.run_id }}
